; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = mbed

; Extra Build Options:

; Configure the CPU to run at 80 MHz.
board_build.f_cpu = 80000000L

; Upload settings and debugger tools
upload_protocol = stlink
debug_tool = stlink

; Debug optimization
; -Og = optimize for debugging OR...
; -O0 = no optimization (easier debugging but slower code)
debug_build_flags = -O0 -g2 -ggdb2

; Monitor (Serial) settings
monitor_speed = 115200

; Specify MbedOS version
platform_packages =
    framework-mbed@6.61700.231105
